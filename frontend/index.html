<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cyclowareness Sandbox</title>
    <script>
      // Apply the stored theme before React mounts, so there is no flash. Light
      // is the unconditional default — the OS dark preference does not override.
      (function () {
        try {
          var t = localStorage.getItem('csbx_theme')
          document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
