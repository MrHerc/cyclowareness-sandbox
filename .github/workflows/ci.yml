name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      APP_ENV: demo
      DATABASE_URL: sqlite:///./ci_test.db
      # SANDBOX_QUARANTINE is set in the test step, not here: the `runner`
      # context does not exist while job-level env is evaluated, so referencing
      # it made the whole workflow invalid — every run failed at startup with no
      # jobs, which reads in the UI like a broken test rather than a broken file.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps for the analysis engine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 unar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run tests
        working-directory: backend
        env:
          SANDBOX_QUARANTINE: ${{ runner.temp }}/quarantine
        run: |
          mkdir -p "$SANDBOX_QUARANTINE"
          # `set +e` because GitHub runs this with `bash -e`: without it pytest's
          # non-zero exit aborts the step before the code below can read it, and
          # the exit-5 case can never be handled.
          set +e
          pytest -q
          rc=$?
          set -e
          # Exit code 5 = "no tests collected"; a pass, so an empty suite does
          # not red the pipeline.
          if [ "$rc" -eq 5 ]; then echo "no tests collected"; exit 0; fi
          exit "$rc"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
