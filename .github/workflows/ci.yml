name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      APP_ENV: demo
      DATABASE_URL: sqlite:///./ci_test.db
      SANDBOX_QUARANTINE: ${{ runner.temp }}/quarantine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps for the analysis engine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 unar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run tests
        working-directory: backend
        run: |
          mkdir -p "$SANDBOX_QUARANTINE"
          # Exit code 5 = "no tests collected"; treat that as a pass so an
          # in-progress test suite does not red the pipeline.
          pytest -q; rc=$?; if [ $rc -eq 5 ]; then echo "no tests collected yet"; exit 0; fi; exit $rc

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
