name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      APP_ENV: demo
      DATABASE_URL: sqlite:///./ci_test.db
      # SANDBOX_QUARANTINE is set in the test step, not here: the `runner`
      # context does not exist while job-level env is evaluated, so referencing
      # it made the whole workflow invalid — every run failed at startup with no
      # jobs, which reads in the UI like a broken test rather than a broken file.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install system deps for the analysis engine
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1 unar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock, so CI installs what the image ships and what sbom.json
          # describes. Installing from the floored requirements.txt meant CI
          # resolved whatever was newest that morning, and the SBOM assertion
          # failed the first time anything upstream released.
          pip install -r backend/requirements.lock.txt pytest

      - name: Run tests
        working-directory: backend
        env:
          SANDBOX_QUARANTINE: ${{ runner.temp }}/quarantine
        run: |
          mkdir -p "$SANDBOX_QUARANTINE"
          # Collecting nothing used to be treated as success, on the reasoning
          # that an empty suite should not red the pipeline. But pytest returns 5
          # for any configuration that finds no tests - a renamed directory, a
          # broken testpaths, an over-broad deselect - so the one thing that
          # should scream loudest went green and silent. This suite has never had
          # fewer than 400 tests; collecting none is a failure.
          pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
