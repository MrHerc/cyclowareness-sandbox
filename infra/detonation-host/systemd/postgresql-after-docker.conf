# systemd drop-in for the PostgreSQL cluster unit.
#
#   install to /etc/systemd/system/postgresql@<version>-main.service.d/10-after-docker.conf
#   then      systemctl daemon-reload
#
# WHY: this deployment runs the API in a container and the database on the host,
# so `postgresql.conf` carries
#
#     listen_addresses = 'localhost,172.17.0.1'
#
# and the container reaches it at `postgresql+psycopg://cyclo@172.17.0.1:5432`.
# `172.17.0.1` is the **docker0 bridge**: an address that does not exist until
# `docker.service` has created it.
#
# The shipped Debian unit is `After=network.target` only, `docker.service` is
# `After=network-online.target` — strictly later — and the unit's ExecStart
# carries a leading `-`, so systemd ignores a non-zero exit and `Restart=` is
# commented out. PostgreSQL binds what it can and logs the rest, so the likely
# outcome of a cold boot is a cluster listening on 127.0.0.1 only, with the API
# unable to reach it and nothing ever re-binding.
#
# How it would present: `/api/health` answers 503 `"database": "unreachable"`,
# `cyclo-api` restarts forever under its `unless-stopped` policy, CAPE (which
# connects over 127.0.0.1) is completely unaffected and looks fine, and the
# guests keep detonating into a database the product cannot read.
#
# Ordering ONLY. No `Requires=`, no `Wants=`: if docker is ever disabled on a
# host this must not stop the database from starting.
[Unit]
After=docker.service
