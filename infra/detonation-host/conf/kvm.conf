[kvm]
# The one machine we actually built. The stock file shipped two placeholder
# entries (cuckoo1, cape1) pointing at the same IP with no matching domain,
# which is why the service crash-looped with "Domain not found: cuckoo1".
machines = cape1
interface = virbr0
dsn = qemu:///system

[cape1]
label = cape1
platform = windows
# Pinned by MAC in libvirt's own DHCP (net-update default add ip-dhcp-host),
# not inside the guest: the unattend TCPIP static config never bound, because
# its <Identifier>Ethernet</Identifier> did not match the real adapter.
ip = 192.168.122.105
arch = x64
# A RUNNING snapshot. CAPE calls revertToSnapshot(flags=0) and immediately
# waits for RUNNING - it never starts the domain itself.
snapshot = clean
resultserver_ip = 192.168.122.1
resultserver_port = 2042
