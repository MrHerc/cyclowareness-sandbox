# TLS termination in front of the Cyclowareness Sandbox API.
#
# WHY THIS EXISTS. The API was published on 0.0.0.0:8080 in plaintext, straight
# to the public internet, and that port serves `/api/dynamic/sample/{id}` --
# the raw bytes of live malware -- alongside every session token and every
# analyst credential in the clear. `DOCKER-USER` was empty, so nothing narrowed
# it either.
#
# The certificate is SELF-SIGNED: this is an on-prem product with no public DNS
# name, and an operator with a real name should replace `cyclo.crt`/`cyclo.key`
# with their own. A browser will warn once and that warning is honest -- what it
# means is "nobody has vouched for this name", not "this channel is not
# encrypted".

# Declared here because this file is included from nginx's `http` context.
# Keyed on the real peer address: this is the proxy, so `$binary_remote_addr` is
# the internet-facing client and not a container address.
limit_req_zone  $binary_remote_addr zone=cyclo_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cyclo_conn:10m;

upstream cyclo_api {
    # By container name on the default bridge, so the API can be rebound to
    # loopback without this proxy losing it.
    server cyclo-api:8000;
    keepalive 16;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/cyclowareness/tls/cyclo.crt;
    ssl_certificate_key /etc/cyclowareness/tls/cyclo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # ECDHE only, server order enforced. `HIGH:!aNULL:!MD5` still negotiates
    # non-forward-secret RSA key exchange and CBC/SHA-1 suites, and with
    # `ssl_prefer_server_ciphers` off the CLIENT's preference wins outright --
    # so a client that offers only a non-PFS suite gets one. No modern browser
    # does, which is exactly why it would never have been noticed.
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 1h;

    # THE REAL CEILING, not a round number. `512m` let an UNAUTHENTICATED
    # caller make nginx spool half a gigabyte to disk before the application --
    # and therefore before authentication and before the rate limiter -- ever
    # saw the request. The app's own limit is MAX_SAMPLE_MB (32), so this is
    # that plus a margin for multipart framing.
    client_max_body_size 34m;
    client_body_buffer_size 256k;
    client_body_timeout 30s;
    # Bytes are throttled BEFORE they are spooled. Without these the rate
    # limiter inside the app cannot reduce the cost of a request, because the
    # body has already been written by the time the middleware runs.
    limit_req  zone=cyclo_req burst=40 nodelay;
    limit_conn cyclo_conn 24;

    # This proxy fronts a service that runs live malware. Nothing here should be
    # framed, sniffed or referred onward.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # A SECOND LAYER BETWEEN A DOM BUG AND SESSION TAKEOVER.
    #
    # This UI renders strings lifted out of live malware -- filenames, signal
    # titles, YARA rule names, IOCs -- so a future injection bug is a question
    # of when. The SPA is one self-hosted bundle with no CDN, no external
    # images and one inline script (the theme bootstrap in index.html), so a
    # strict policy fits today rather than being aspirational.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    location / {
        proxy_pass http://cyclo_api;
        proxy_http_version 1.1;
        # The API derives the rate-limit identity and the audit trail's source_ip
        # from the client address, so the real one has to survive the hop.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # /api/ws is a WebSocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
