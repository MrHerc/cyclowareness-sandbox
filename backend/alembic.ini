# Cyclowareness Sandbox — schema migrations.
#
# This is an on-prem product: a customer upgrades a running install with a
# database that already holds their evidence. `create_all()` only ever CREATEs
# tables, so a release that added a column left every job route returning
# "no such column" with the health endpoint still reporting 200. Alembic is what
# makes an upgrade — and a rollback — a real, tested operation.
#
# The service applies migrations itself at boot (app.db.init_db), so a normal
# `docker run` needs none of the commands below. They exist for the operator who
# wants to run the upgrade as a separate, reviewable step.
#
# Operator commands (run from this directory, with DATABASE_URL set exactly as
# the service will see it — the URL comes from the app's own settings, never
# from this file):
#
#   alembic current                 show the revision this database is at
#   alembic history --verbose       list revisions
#   alembic upgrade head            apply everything outstanding
#   alembic downgrade -1            roll back the most recent revision
#   alembic downgrade 0001_baseline roll back to the pre-CVSS schema
#   alembic stamp 0001_baseline     adopt a pre-Alembic database WITHOUT running
#                                   any DDL (its tables already exist)
#
# `stamp` is the upgrade path for a database created before this file existed.
# init_db() performs the equivalent adoption automatically at boot; the command
# is here for operators who apply migrations out of band.

[alembic]
# Relative to %(here)s — the directory holding this file — so the CLI works from
# any working directory, and so does the programmatic upgrade in the container.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# sqlalchemy.url is deliberately ABSENT. env.py reads DATABASE_URL through
# app.config.get_settings(), so the CLI and the running service can never
# disagree about which database is being migrated.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
